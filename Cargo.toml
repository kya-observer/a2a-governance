[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/kya-observer/a2a-governance"

[workspace.dependencies]
a2a-gov-extension = { path = "crates/a2a-gov-extension" }
a2a-gov-mandate = { path = "crates/a2a-gov-mandate" }
a2a-gov-receipt = { path = "crates/a2a-gov-receipt" }
a2a-gov-pdp = { path = "crates/a2a-gov-pdp" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
