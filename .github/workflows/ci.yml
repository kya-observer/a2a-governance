name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every commit in a pull request needs a Signed-off-by from its author (DCO).
  # The DCO GitHub App can enforce the same thing at the org level; this job
  # keeps the check in the repo and in every fork.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Interop is re-proven on every run with freshly minted vectors, in both
  # directions, against Google's AP2 SDK and the official a2a-sdk.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: "1.97"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: AP2 SDK verifies chains and receipts minted in Rust
        run: |
          cargo run -q -p a2a-gov-mandate --example gen_vectors
          cargo run -q -p a2a-gov-receipt --example gen_receipt_vectors
          cd interop/ap2 && uv sync --python 3.13 && uv run pytest
      - name: Rust verifies chains and receipts minted by the AP2 SDK
        run: |
          (cd interop/ap2 && uv run python gen_ap2_vectors.py && uv run python gen_ap2_receipts.py)
          cargo test -q -p a2a-gov-mandate --test ap2_interop
          cargo test -q -p a2a-gov-receipt --test ap2_interop
      - name: Agent Card signatures and RFC 8785 agree with the a2a-sdk, both ways
        run: |
          cargo run -q -p a2a-gov-card --example gen_card_vectors
          (cd interop/a2a && uv sync --python 3.13 && uv run python gen_card_vectors.py && uv run python gen_jcs_vectors.py)
          cargo test -q -p a2a-gov-card
      - name: a2a-sdk parses the extension's A2A shapes, and they survive its round trip
        run: |
          cargo run -q -p a2a-gov-binding --example gen_binding_vectors
          cd interop/a2a && uv sync --python 3.13 && uv run pytest && uv run python roundtrip.py
          cd ../.. && cargo test -q -p a2a-gov-binding --test a2a_sdk_roundtrip

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: "1.97"
      - name: Every security check has a test that fails without it
        run: python3 scripts/mutation-check.py
